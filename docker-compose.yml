services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sakhi
      POSTGRES_PASSWORD: sakhi_dev_only
      POSTGRES_DB: sakhi
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakhi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata: